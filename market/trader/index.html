<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Trade Helper</title>

  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    :root {
      --bg: #0f1116;
      --panel: #1a1d24;
      --border: #2a2e39;
      --text: #e6e6e6;
      --accent: #4da3ff;
      --accent-hover: #6bb6ff;
      --danger: #f30000;
      --success: #4dff88;
      --short: #fe0000;
      --long: #4dff88;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    h3 {
      margin-top: 30px;
      color: var(--accent);
      font-weight: 600;
    }

    #symbolHistory,
    #tradeHistory {
      background: var(--panel);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      min-height: 40px;
      margin-bottom: 20px;
    }

    label {
      margin-right: 10px;
      font-weight: 600;
    }

    input,
    select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      margin-right: 10px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-right: 10px;
    }

    a:hover {
      color: var(--accent-hover);
    }

    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      transition: 0.2s;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent);
      color: #000;
    }

    #makeTrade {
      border-color: var(--danger);
    }

    #makeTrade:hover {
      background: var(--danger);
      color: #000;
    }

    #makeMarketTrade {
      border-color: var(--success);
    }

    #makeShortMarketTrade {
      border-color: var(--short);
    }

    #makeMarketTrade:hover {
      background: var(--success);
      color: #000;
    }

    #chart {
      width: 100%;
      height: 500px;
      border: 1px solid var(--border);
      background: #000;
      margin-top: 10px;
      border-radius: 6px;
    }

    /* TABS */
    #tabBar {
      display: flex;
      gap: 5px;
      margin-bottom: 10px;
      overflow-x: auto;
      padding-bottom: 5px;
    }

    .tab-button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 15px;
      border-radius: 4px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 10px;
      white-space: nowrap;
    }

    .tab-button.active {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .tab-button .close-tab {
      font-weight: bold;
      opacity: 0.6;
    }

    .tab-button .close-tab:hover {
      opacity: 1;
    }

    .tab-content {
      display: none;
    }

    .tab-content.active {
      display: block;
    }
  </style>
</head>

<body>
  
  <h3>Recent Symbols</h3>
  <div id="symbolHistory"></div>
<body>
  <div id="tabBar"></div>
  <div id="tabContainer">
    <!-- Tab contents will be injected here -->
  </div>

  <template id="tabTemplate">
    <div class="tab-content">
      <div class="tab-header">
        <h3 class="tab-title">Symbol</h3>
        <div class="symbol-info">
          <a class="chartLink" href="">Etoro Chart</a> |
          <a class="newsLink" href="">Yahoo News</a>
          <button class="loadBtn">Load Chart</button>
          <button class="clearLinesBtn">Clear Lines</button>
        </div>
        <hr/>
        <label>Symbol:</label>
        <input class="symbolInput" value="" />
        
        <label>Interval:</label>
        <select class="intervalSelect">
          <option value="OneMinute">1 Minute</option>
          <option value="FiveMinutes">5 Minutes</option>
          <option value="TenMinutes">10 Minutes</option>
          <option value="FifteenMinutes" selected>15 Minutes</option>
          <option value="ThirtyMinutes">30 Minutes</option>
          <option value="OneHour">1 Hour</option>
          <option value="FourHours">4 Hours</option>
          <option value="OneDay">1 Day</option>
          <option value="OneWeek">1 Week</option>
        </select>
        
        <h3>Trade Actions</h3>
        <button class="makeTradeBtn">BID Trade</button>
        <button class="makeMarketTradeBtn">LONG At Market</button>

        <div class="marketPriceInfo" style="margin-top: 15px; font-size: 1em; color: var(--accent);">
          Current Price: <span class="currentPriceDisplay" style="font-weight: bold;">$0.00</span> | 
          <span style="font-size: 0.9em; opacity: 0.8;">
            +1%: <span class="plus1" style="color: var(--success);">0</span> | 
            +2%: <span class="plus2" style="color: var(--success);">0</span> | 
            -1%: <span class="minus1" style="color: var(--danger);">0</span> | 
            -2%: <span class="minus2" style="color: var(--danger);">0</span>
          </span>
        </div>

        <div class="pnlDisplay" style="margin-top: 5px; font-size: 1.1em; font-weight: bold;">
          Potential Profit: <span class="profitDollar" style="color: var(--success);">$0.00</span> (<span class="profitPcnt">0.00%</span>) | 
          Potential Stop: <span class="stopDollar" style="color: var(--danger);">$0.00</span> (<span class="stopPcnt">0.00%</span>)
        </div>
      </div>

      <div class="chart-container" style="width: 100%; height: 500px; border: 1px solid var(--border); background: #000; margin-top: 10px; border-radius: 6px;"></div>

      <h3>Saved Trades</h3>
      <div class="tradeHistory"></div>

      <hr/>
      <h3>Trade Settings</h3>
      <label>Leverage:</label>
      <input class="leverageInput" type="number" value="5" min="1" />
      <br/>
      <label>Amount ($):</label>
      <input class="amountInput" type="number" value="1000" min="10" />
      <br/>
      <label>Margin %:</label>
      <input class="marginInput" type="number" value="1" step="0.1" min="0" />
      <br/>
      <label>Refresh (sec):</label>
      <input class="refreshIntervalInput" type="number" value="30" min="1" />
    </div>
  </template>

  <script type="module" src="renderer.js"></script>
</body>

</html>
