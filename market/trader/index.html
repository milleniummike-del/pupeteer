<!DOCTYPE html>
<html>

<head>
  <meta charset="UTF-8" />
  <title>Trade Helper</title>

  <script src="https://unpkg.com/lightweight-charts@4.1.0/dist/lightweight-charts.standalone.production.js"></script>

  <style>
    :root {
      --bg: #0f1116;
      --panel: #1a1d24;
      --border: #2a2e39;
      --text: #e6e6e6;
      --accent: #4da3ff;
      --accent-hover: #6bb6ff;
      --danger: #d2bb34;
      --success: #4dff88;
      --short: #fe0000;
      --long: #4dff88;
    }

    body {
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 20px;
    }

    h3 {
      margin-top: 30px;
      color: var(--accent);
      font-weight: 600;
    }

    #symbolHistory,
    #tradeHistory {
      background: var(--panel);
      padding: 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      min-height: 40px;
      margin-bottom: 20px;
    }

    label {
      margin-right: 10px;
      font-weight: 600;
    }

    input,
    select {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 10px;
      border-radius: 4px;
      margin-right: 10px;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
      margin-right: 10px;
    }

    a:hover {
      color: var(--accent-hover);
    }

    button {
      background: var(--panel);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 8px 14px;
      border-radius: 4px;
      cursor: pointer;
      margin-right: 10px;
      transition: 0.2s;
      font-weight: 600;
    }

    button:hover {
      background: var(--accent);
      color: #000;
    }

    #makeTrade {
      border-color: var(--danger);
    }

    #makeTrade:hover {
      background: var(--danger);
      color: #000;
    }

    #makeMarketTrade {
      border-color: var(--success);
    }

    #makeShortMarketTrade {
      border-color: var(--short);
    }

    #makeMarketTrade:hover {
      background: var(--success);
      color: #000;
    }

    #chart {
      width: 100%;
      height: 500px;
      border: 1px solid var(--border);
      background: #000;
      margin-top: 20px;
      border-radius: 6px;
    }
  </style>
</head>

<body>
  <h3>Recent Symbols</h3>
  <div id="symbolHistory"></div>

  <label>Symbol:</label>
  <input id="symbol" value="BTC" />
  
  <label for="interval">Interval:</label>
  <select id="interval">
    <option value="OneMinute">1 Minute</option>
    <option value="FiveMinutes">5 Minutes</option>
    <option value="TenMinutes">10 Minutes</option>
    <option value="FifteenMinutes" selected>15 Minutes</option>
    <option value="ThirtyMinutes">30 Minutes</option>
    <option value="OneHour">1 Hour</option>
    <option value="FourHours">4 Hours</option>
    <option value="OneDay">1 Day</option>
    <option value="OneWeek">1 Week</option>
  </select>
<hr/>
  <a id="chartLink" href="">Etoro Chart</a> |
  <a id="newsLink" href="">Yahoo News</a>
  <button id="load">Load Chart</button>
  <button id="clearLines">Clear Lines</button>

  <script>
    document.getElementById("chartLink").addEventListener("click", (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value.trim().toUpperCase();
      const link = 'https://www.etoro.com/markets/' + symbol + '/chart';
      window.api.openExternal(link);
    });

    document.getElementById("newsLink").addEventListener("click", (e) => {
      e.preventDefault();
      const symbol = document.getElementById("symbol").value.trim().toUpperCase();
      const link = 'https://finance.yahoo.com/quote/' + symbol + '/news/';
      window.api.openExternal(link);
    });
  </script>

  <hr/>
    <h3>Trade Actions</h3>
  <button id="makeTrade">BID Trade</button>
  <button id="makeMarketTrade">LONG At Market</button>
  <button id="makeShortMarketTrade">SHORT At Market</button>

  <div id="marketPriceInfo" style="margin-top: 15px; font-size: 1em; color: var(--accent);">
    Current Price: <span id="currentPriceDisplay" style="font-weight: bold;">$0.00</span> | 
    <span style="font-size: 0.9em; opacity: 0.8;">
      +1%: <span id="plus1" style="color: var(--success);">0</span> | 
      +2%: <span id="plus2" style="color: var(--success);">0</span> | 
      -1%: <span id="minus1" style="color: var(--danger);">0</span> | 
      -2%: <span id="minus2" style="color: var(--danger);">0</span>
    </span>
  </div>

  <div id="pnlDisplay" style="margin-top: 5px; font-size: 1.1em; font-weight: bold;">
    Potential Profit: <span id="profitDollar" style="color: var(--success);">$0.00</span> (<span id="profitPcnt">0.00%</span>) | 
    Potential Stop: <span id="stopDollar" style="color: var(--danger);">$0.00</span> (<span id="stopPcnt">0.00%</span>)
  </div>

  <div id="chart"></div>

  <h3>Saved Trades</h3>
  <div id="tradeHistory"></div>

<hr/>
  <h3>Trade Settings</h3>
  <label for="leverage">Leverage:</label>
  <input id="leverage" type="number" value="5" min="1" />
<br/>
  <label for="amount">Amount ($):</label>
  <input id="amount" type="number" value="1000" min="10" />
<br/>
  <label for="margin">Margin %:</label>
  <input id="margin" type="number" value="2" step="0.1" min="0" />
  <br/>
    <label for="refreshInterval">Refresh (sec):</label>
  <input id="refreshInterval" type="number" value="30" min="1" />

  <script type="module" src="renderer.js"></script>
</body>

</html>
